<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小学pdf课本单词转json</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #4b6cb7 0%, #182848 100%);
            color: white;
            padding: 25px 30px;
            text-align: center;
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        
        .subtitle {
            opacity: 0.85;
            font-size: 16px;
            font-weight: 400;
        }
        
        .content {
            padding: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }
        
        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }
        
        .input-section, .output-section {
            display: flex;
            flex-direction: column;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #2c3e50;
            display: flex;
            align-items: center;
        }
        
        .section-title i {
            margin-right: 10px;
            color: #4b6cb7;
        }
        
        textarea {
            width: 100%;
            height: 300px;
            padding: 15px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            line-height: 1.5;
            resize: vertical;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #4b6cb7;
        }
        
        .input-textarea {
            background-color: #f8fafc;
        }
        
        .output-textarea {
            background-color: #f0f7ff;
            font-family: 'Consolas', 'Monaco', monospace;
            white-space: pre;
        }
        
        .button-container {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }
        
        .convert-btn {
            background: linear-gradient(to right, #4b6cb7, #3a56a4);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(75, 108, 183, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .convert-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(75, 108, 183, 0.3);
            background: linear-gradient(to right, #3a56a4, #2d4485);
        }
        
        .convert-btn:active {
            transform: translateY(0);
        }
        
        .convert-btn i {
            margin-right: 8px;
        }
        
        .instructions {
            background-color: #f0f9ff;
            border-left: 4px solid #4b6cb7;
            padding: 15px;
            margin-top: 20px;
            border-radius: 0 8px 8px 0;
        }
        
        .instructions h3 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .instructions ul {
            padding-left: 20px;
        }
        
        .instructions li {
            margin-bottom: 8px;
        }
        
        .example {
            font-size: 14px;
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            border: 1px dashed #ccc;
        }
        
        .error-message {
            color: #e74c3c;
            background-color: #ffeaea;
            padding: 10px;
            border-radius: 6px;
            margin-top: 15px;
            display: none;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
            font-size: 14px;
            border-top: 1px solid #eee;
        }
        
        .word-count {
            margin-top: 10px;
            color: #4b6cb7;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>文本行转JSON转换器</h1>
            <p class="subtitle">将每行文本按格式转换为JSON对象</p>
        </header>
        
        <div class="content">
            <div class="input-section">
                <div class="section-title">
                    <i class="fas fa-keyboard"></i> 输入文本
                </div>
                <textarea class="input-textarea" id="inputText" placeholder="请输入文本，每行格式为：
word /pronunciation/ 中文释义
例如：
hello /həˈləʊ/ 你好，喂
apple /ˈæpl/ 苹果
goodbye /ˌɡʊdˈbaɪ/ 再见"></textarea>
                <div class="word-count" id="wordCount">0 行文本</div>
                
                <div class="button-container">
                    <button class="convert-btn" id="convertBtn">
                        <i class="fas fa-exchange-alt"></i> 转换为JSON
                    </button>
                </div>
                
                <div class="error-message" id="errorMessage">
                    <i class="fas fa-exclamation-circle"></i> <span id="errorText"></span>
                </div>
            </div>
            
            <div class="output-section">
                <div class="section-title">
                    <i class="fas fa-code"></i> JSON输出
                </div>
                <textarea class="output-textarea" id="outputText" readonly placeholder="转换后的JSON将显示在这里"></textarea>
                <div class="button-container">
                    <button class="convert-btn" id="copyBtn" style="background: linear-gradient(to right, #27ae60, #219653);">
                        <i class="far fa-copy"></i> 复制JSON
                    </button>
                </div>
            </div>
        </div>
        
        <div class="instructions">
            <h3>使用说明</h3>
            <ul>
                <li>每行文本格式：<strong>英语单词 空格 /英语读音/ 空格 中文释义</strong></li>
                <li>确保单词、读音和释义之间用<strong>单个空格</strong>分隔</li>
                <li>英语读音必须用<strong>/斜杠/</strong>包围</li>
                <li>每行文本将转换为一个独立的JSON对象</li>
                <li>转换后的JSON数组可以直接在代码中使用</li>
            </ul>
            <div class="example">
                <strong>示例：</strong> hello /həˈləʊ/ 你好，问候语
            </div>
        </div>
        
        <footer>
            <p>文本行转JSON转换器 &copy; 2023 | 每行转换为 {"word": "单词", "pronunciation": "读音", "meaning": "释义"}</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const inputTextarea = document.getElementById('inputText');
            const outputTextarea = document.getElementById('outputText');
            const convertBtn = document.getElementById('convertBtn');
            const copyBtn = document.getElementById('copyBtn');
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const wordCount = document.getElementById('wordCount');
            
            // 更新行数统计
            function updateWordCount() {
                const lines = inputTextarea.value.split('\n').filter(line => line.trim() !== '');
                wordCount.textContent = `${lines.length} 行文本`;
            }
            
            // 初始更新行数统计
            updateWordCount();
            
            // 输入文本变化时更新行数
            inputTextarea.addEventListener('input', updateWordCount);
            
            // 转换函数
            function convertToJson() {
                // 隐藏之前的错误信息
                errorMessage.style.display = 'none';
                
                const input = inputTextarea.value.trim();
                if (!input) {
                    showError('请输入文本内容');
                    return;
                }
                
                const lines = input.split('\n');
                const result = [];
                let errorLines = [];
                
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue; // 跳过空行
                    
                    // 解析每行文本
                    const parsed = parseLine(line, i + 1);
                    if (parsed.error) {
                        errorLines.push(`第 ${i + 1} 行: ${parsed.error}`);
                    } else {
                        result.push(parsed.data);
                    }
                }
                
                if (errorLines.length > 0) {
                    showError(`以下行格式不正确：<br>${errorLines.join('<br>')}`);
                }
                
                if (result.length > 0) {
                    outputTextarea.value = JSON.stringify(result, null, 2);
                } else {
                    outputTextarea.value = '';
                }
            }
            
            // 解析单行文本
            function parseLine(line, lineNumber) {
                // 匹配格式：单词 /发音/ 释义
                // 使用正则表达式匹配
                const pattern = /^(\S+)\s+\/([^/]+)\/\s+(.+)$/;
                const match = line.match(pattern);
                
                if (!match) {
                    return { 
                        error: `格式不正确。正确格式：单词 /发音/ 释义（当前内容："${line.length > 30 ? line.substring(0, 30) + '...' : line}"）`
                    };
                }
                
                const word = match[1].trim();
                const pronunciation = match[2].trim();
                const meaning = match[3].trim();
                
                return {
                    data: {
                        word: word,
                        dy: pronunciation,
                        meaning: meaning,
						type:[]
                    }
                };
            }
            
            // 显示错误信息
            function showError(message) {
                errorText.innerHTML = message;
                errorMessage.style.display = 'block';
            }
            
            // 复制JSON到剪贴板
            function copyToClipboard() {
                if (!outputTextarea.value) {
                    showError('没有可复制的JSON内容');
                    return;
                }
                
                navigator.clipboard.writeText(outputTextarea.value)
                    .then(() => {
                        // 临时改变按钮文本和颜色
                        const originalText = copyBtn.innerHTML;
                        copyBtn.innerHTML = '<i class="fas fa-check"></i> 已复制!';
                        copyBtn.style.background = 'linear-gradient(to right, #27ae60, #219653)';
                        
                        setTimeout(() => {
                            copyBtn.innerHTML = originalText;
                        }, 2000);
                    })
                    .catch(err => {
                        console.error('复制失败: ', err);
                        showError('复制失败，请手动选择并复制文本');
                    });
            }
            
            // 添加示例数据
            function addExample() {
                const example = `hello /həˈləʊ/ 你好，喂
apple /ˈæpl/ 苹果
goodbye /ˌɡʊdˈbaɪ/ 再见
computer /kəmˈpjuːtə(r)/ 计算机
beautiful /ˈbjuːtɪfl/ 美丽的，美好的
education /ˌedʒuˈkeɪʃn/ 教育
friendship /ˈfrendʃɪp/ 友谊
technology /tekˈnɒlədʒi/ 技术，科技`;
                
                inputTextarea.value = example;
                updateWordCount();
            }
            
            // 绑定事件
            convertBtn.addEventListener('click', convertToJson);
            copyBtn.addEventListener('click', copyToClipboard);
            
            // 页面加载时添加示例
            addExample();
            // 初始转换一次
            convertToJson();
        });
    </script>
</body>
</html>
